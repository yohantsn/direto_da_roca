name: 🔍 Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect which modules were changed in the PR
  # ──────────────────────────────────────────────
  detect-changes:
    name: 🗺️ Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Flutter modules
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          MODULES=()
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/pubspec.yaml" ]; then
                MODULES+=("$dir")
                break
              fi
              dir=$(dirname "$dir")
            done
            if [ -f "pubspec.yaml" ] && [[ "$file" != *"/"* ]]; then
              MODULES+=(".")
            fi
          done <<< "$CHANGED_FILES"

          UNIQUE_MODULES=$(printf '%s\n' "${MODULES[@]}" | sort -u | jq -R . | jq -sc .)

          if [ "$UNIQUE_MODULES" = "[]" ] || [ -z "$UNIQUE_MODULES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "modules=$UNIQUE_MODULES" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # Formatting — dart format
  # ──────────────────────────────────────────────
  format-check:
    name: 🎨 Dart Format
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      result: ${{ steps.format.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Check formatting
        id: format
        run: |
          MODULES='${{ needs.detect-changes.outputs.modules }}'
          mkdir -p /tmp/qg-reports
          REPORT_FILE="/tmp/qg-reports/format.md"
          OVERALL_RESULT="success"

          for module in $(echo "$MODULES" | jq -r '.[]'); do
            echo "Checking format in: $module"
            cd "$GITHUB_WORKSPACE/$module"

            UNFORMATTED=$(dart format --output=none --set-exit-if-changed . 2>&1 || true)
            if echo "$UNFORMATTED" | grep -q "Formatted"; then
              OVERALL_RESULT="failure"
              echo "#### $module" >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              echo "$UNFORMATTED" | head -20 >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
            fi
          done

          if [ "$OVERALL_RESULT" = "success" ]; then
            echo "_All files are properly formatted._" > "$REPORT_FILE"
          fi

          echo "result=$OVERALL_RESULT" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qg-format-report
          path: /tmp/qg-reports/format.md
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Static analysis — flutter analyze
  # ──────────────────────────────────────────────
  static-analysis:
    name: 🔬 Static Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      result: ${{ steps.analyze.outputs.result }}
      errors: ${{ steps.analyze.outputs.errors }}
      warnings: ${{ steps.analyze.outputs.warnings }}
      infos: ${{ steps.analyze.outputs.infos }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Run flutter analyze
        id: analyze
        run: |
          MODULES='${{ needs.detect-changes.outputs.modules }}'
          mkdir -p /tmp/qg-reports
          REPORT_FILE="/tmp/qg-reports/analyze.md"
          TOTAL_ERRORS=0
          TOTAL_WARNINGS=0
          TOTAL_INFOS=0

          for module in $(echo "$MODULES" | jq -r '.[]'); do
            echo "Analyzing: $module"
            cd "$GITHUB_WORKSPACE/$module"
            flutter pub get --quiet

            OUTPUT=$(flutter analyze --no-pub 2>&1 || true)

            ERRORS=$(echo "$OUTPUT" | grep -c "error •" || true)
            WARNINGS=$(echo "$OUTPUT" | grep -c "warning •" || true)
            INFOS=$(echo "$OUTPUT" | grep -c "info •" || true)

            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            TOTAL_WARNINGS=$((TOTAL_WARNINGS + WARNINGS))
            TOTAL_INFOS=$((TOTAL_INFOS + INFOS))

            if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
              echo "#### $module — $ERRORS error(s), $WARNINGS warning(s)" >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              echo "$OUTPUT" | grep -E "error •|warning •" | head -30 >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
            fi
          done

          echo "errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$TOTAL_WARNINGS" >> $GITHUB_OUTPUT
          echo "infos=$TOTAL_INFOS" >> $GITHUB_OUTPUT

          if [ "$TOTAL_ERRORS" -gt 0 ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [ "$TOTAL_WARNINGS" -gt 0 ]; then
            echo "result=warning" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
            echo "_No errors or warnings found._" > "$REPORT_FILE"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qg-analyze-report
          path: /tmp/qg-reports/analyze.md
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Tests + Coverage >= 80%
  # ──────────────────────────────────────────────
  test-coverage:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      result: ${{ steps.coverage.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        id: coverage
        run: |
          MODULES='${{ needs.detect-changes.outputs.modules }}'
          mkdir -p /tmp/qg-reports
          TABLE_FILE="/tmp/qg-reports/coverage-table.md"
          DETAILS_FILE="/tmp/qg-reports/coverage-details.md"
          OVERALL_RESULT="success"

          echo "| Module | Coverage | Status |" >> "$TABLE_FILE"
          echo "|--------|----------|--------|" >> "$TABLE_FILE"

          for module in $(echo "$MODULES" | jq -r '.[]'); do
            echo "Testing: $module"
            cd "$GITHUB_WORKSPACE/$module"
            flutter pub get --quiet

            if [ ! -d "test" ]; then
              echo "| \`$module\` | N/A | No tests found |" >> "$TABLE_FILE"
              continue
            fi

            TEST_OUTPUT=$(flutter test --coverage --no-pub 2>&1)
            TEST_EXIT=$?

            if [ $TEST_EXIT -ne 0 ]; then
              echo "| \`$module\` | — | Tests failing |" >> "$TABLE_FILE"
              echo "#### $module — Tests failing" >> "$DETAILS_FILE"
              echo '```' >> "$DETAILS_FILE"
              echo "$TEST_OUTPUT" | tail -30 >> "$DETAILS_FILE"
              echo '```' >> "$DETAILS_FILE"
              OVERALL_RESULT="failure"
              continue
            fi

            if [ -f "coverage/lcov.info" ]; then
              COVERAGE_PCT=$(lcov --summary coverage/lcov.info 2>&1 \
                | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
              COVERAGE_PCT="${COVERAGE_PCT:-0}"
              COVERAGE_INT=$(echo "$COVERAGE_PCT" | cut -d. -f1)

              if [ "$COVERAGE_INT" -ge 80 ]; then
                echo "| \`$module\` | ${COVERAGE_PCT}% | Passed |" >> "$TABLE_FILE"
              else
                echo "| \`$module\` | ${COVERAGE_PCT}% | Below 80% |" >> "$TABLE_FILE"
                echo "#### $module — Insufficient coverage: ${COVERAGE_PCT}% (minimum: 80%)" >> "$DETAILS_FILE"
                OVERALL_RESULT="failure"
              fi
            else
              echo "| \`$module\` | N/A | No report generated |" >> "$TABLE_FILE"
            fi
          done

          echo "result=$OVERALL_RESULT" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qg-coverage-report
          path: /tmp/qg-reports/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Dead code & duplicate functions
  # ──────────────────────────────────────────────
  dead-code-duplicates:
    name: 🧟 Dead Code & Duplicates
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      result: ${{ steps.analysis.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dart_code_metrics
        run: dart pub global activate dart_code_metrics

      - name: Detect dead code & duplicates
        id: analysis
        run: |
          MODULES='${{ needs.detect-changes.outputs.modules }}'
          mkdir -p /tmp/qg-reports
          REPORT_FILE="/tmp/qg-reports/dead-code.md"
          OVERALL_RESULT="success"

          for module in $(echo "$MODULES" | jq -r '.[]'); do
            echo "Checking: $module"
            cd "$GITHUB_WORKSPACE/$module"
            flutter pub get --quiet

            DCM_OUTPUT=$(dart pub global run dart_code_metrics:metrics analyze lib \
              --metrics=unused-code --reporter=console 2>&1 || true)

            if echo "$DCM_OUTPUT" | grep -qi "unused"; then
              echo "#### $module — Dead code detected" >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              echo "$DCM_OUTPUT" | grep -i "unused" | head -10 >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              OVERALL_RESULT="warning"
            fi

            FUNC_SIGS=$(grep -rn "^\s*\(Future\|void\|String\|int\|bool\|double\|List\|Map\|Widget\|dynamic\)" lib/ \
              --include="*.dart" 2>/dev/null \
              | grep -oP '(?<=\s)\w+\s*\(' | sort | uniq -d | head -20 || true)

            if [ -n "$FUNC_SIGS" ]; then
              echo "#### $module — Possible duplicate functions" >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              echo "$FUNC_SIGS" >> "$REPORT_FILE"
              echo '```' >> "$REPORT_FILE"
              OVERALL_RESULT="warning"
            fi
          done

          if [ "$OVERALL_RESULT" = "success" ]; then
            echo "_No dead code or duplicates found._" > "$REPORT_FILE"
          fi

          echo "result=$OVERALL_RESULT" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qg-dead-code-report
          path: /tmp/qg-reports/dead-code.md
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Consolidated PR comment
  # ──────────────────────────────────────────────
  pr-comment:
    name: 💬 PR Quality Report
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - format-check
      - static-analysis
      - test-coverage
      - dead-code-duplicates
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: qg-*-report
          path: /tmp/qg-reports
          merge-multiple: true

      - name: Build and post PR comment
        uses: actions/github-script@v7
        env:
          FORMAT_RESULT:    ${{ needs.format-check.outputs.result }}
          ANALYZE_RESULT:   ${{ needs.static-analysis.outputs.result }}
          ANALYZE_ERRORS:   ${{ needs.static-analysis.outputs.errors }}
          ANALYZE_WARNINGS: ${{ needs.static-analysis.outputs.warnings }}
          ANALYZE_INFOS:    ${{ needs.static-analysis.outputs.infos }}
          TEST_RESULT:      ${{ needs.test-coverage.outputs.result }}
          DEAD_RESULT:      ${{ needs.dead-code-duplicates.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const readReport = (path) => {
              try { return fs.readFileSync(path, 'utf8').trim(); }
              catch { return '_Report not available._'; }
            };

            const formatReport    = readReport('/tmp/qg-reports/format.md');
            const analyzeReport   = readReport('/tmp/qg-reports/analyze.md');
            const coverageTable   = readReport('/tmp/qg-reports/coverage-table.md');
            const coverageDetails = readReport('/tmp/qg-reports/coverage-details.md');
            const deadCodeReport  = readReport('/tmp/qg-reports/dead-code.md');

            const formatResult  = process.env.FORMAT_RESULT  || 'skipped';
            const analyzeResult = process.env.ANALYZE_RESULT || 'skipped';
            const testResult    = process.env.TEST_RESULT    || 'skipped';
            const deadResult    = process.env.DEAD_RESULT    || 'skipped';
            const errors        = process.env.ANALYZE_ERRORS   || '0';
            const warnings      = process.env.ANALYZE_WARNINGS || '0';
            const infos         = process.env.ANALYZE_INFOS    || '0';

            const icon  = (r) => ({ success: '✅', failure: '❌', warning: '⚠️', skipped: '⏭️' }[r] ?? '⚙️');
            const badge = (r) => ({ success: '**PASSED**', failure: '**FAILED**', warning: '**WARNING**', skipped: 'Skipped' }[r] ?? 'N/A');

            const mandatory  = [formatResult, analyzeResult, testResult];
            const allPassed  = mandatory.every(r => r === 'success');
            const anyFailed  = mandatory.some(r => r === 'failure');
            const hasWarnings = [deadResult, analyzeResult].some(r => r === 'warning');

            const overallIcon  = anyFailed ? '❌' : (hasWarnings ? '⚠️' : '✅');
            const overallLabel = anyFailed
              ? 'FAILED — fix the mandatory checks before merging'
              : allPassed
                ? (hasWarnings ? 'PASSED WITH WARNINGS' : 'PASSED')
                : 'PARTIAL';

            const now = new Date().toUTCString();

            const lines = [
              `## ${overallIcon} Quality Gate — ${overallLabel}`,
              `> Automated PR analysis · ${now} · Flutter 3.41.9`,
              `---`,
              `### Mandatory checks (block merge on failure)`,
              `| Check | Status | Result |`,
              `|-------|--------|--------|`,
              `| 🎨 Formatting \`dart format\` | ${icon(formatResult)} | ${badge(formatResult)} |`,
              `| 🔬 Static analysis \`flutter analyze\` | ${icon(analyzeResult)} | ${badge(analyzeResult)} |`,
              `| 🧪 Tests & Coverage >= 80% | ${icon(testResult)} | ${badge(testResult)} |`,
              ``,
              `### Informational checks (do not block merge)`,
              `| Check | Status | Result |`,
              `|-------|--------|--------|`,
              `| 🧟 Dead code & Duplicates | ${icon(deadResult)} | ${badge(deadResult)} |`,
              `---`,
              `### 🧪 Coverage by module`,
              coverageTable,
              coverageDetails ? `\n${coverageDetails}` : '',
              `---`,
              `### 🔬 Static analysis`,
              `| Errors | Warnings | Info |`,
              `|--------|----------|------|`,
              `| ${errors} ❌ | ${warnings} ⚠️ | ${infos} ℹ️ |`,
              ``,
              analyzeReport,
              `---`,
              `### 🧟 Dead code & Duplicates`,
              deadCodeReport,
              `---`,
              `<details>`,
              `<summary>🎨 Formatting details</summary>`,
              ``,
              formatReport,
              `</details>`,
              ``,
              `<details>`,
              `<summary>ℹ️ How to fix common issues</summary>`,
              ``,
              `**Formatting:** \`dart format .\``,
              ``,
              `**Static analysis:** \`flutter analyze\``,
              ``,
              `**Tests with coverage:**`,
              `\`\`\`bash`,
              `flutter test --coverage`,
              `genhtml coverage/lcov.info -o coverage/html`,
              `\`\`\``,
              ``,
              `**Dead code:** \`dart pub global run dart_code_metrics:metrics analyze lib\``,
              `</details>`,
              ``,
              `---`,
              `_🤖 Quality Gate · [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ];

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Quality Gate')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce mandatory gates
        if: |
          needs.format-check.outputs.result == 'failure' ||
          needs.static-analysis.outputs.result == 'failure' ||
          needs.test-coverage.outputs.result == 'failure'
        run: |
          echo "Quality Gate FAILED. Fix all mandatory checks before merging."
          exit 1